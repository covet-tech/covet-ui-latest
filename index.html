<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Covet Docs</title>
  <style>
    :root {
      --cherry: #e02d56;
      --cherry-dark: #b81f44;
      --ink: #29192b;
      --muted: #6b5560;
      --line: #eadfe3;
      --bg: #fdf8f6;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(224, 45, 86, 0.10), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(41, 25, 43, 0.08), transparent 45%),
        var(--bg);
    }
    main { width: 100%; max-width: 560px; text-align: center; }
    h1 { font-size: 2.5rem; letter-spacing: -0.02em; margin-bottom: 8px; }
    h1 span { color: var(--cherry); }
    p.lead { color: var(--muted); margin-bottom: 36px; font-size: 1.05rem; }
    nav { display: flex; flex-direction: column; gap: 14px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(41, 25, 43, 0.04), 0 4px 16px rgba(41, 25, 43, 0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }
    .btn small { display: block; font-weight: 400; font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .btn .text { text-align: left; }
    .btn .arrow {
      flex-shrink: 0;
      width: 36px; height: 36px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(224, 45, 86, 0.1);
      color: var(--cherry);
      transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease;
    }
    .btn:hover, .btn:focus-visible {
      transform: translateY(-2px);
      border-color: var(--cherry);
      box-shadow: 0 8px 28px rgba(224, 45, 86, 0.18);
      outline: none;
    }
    .btn:hover .arrow, .btn:focus-visible .arrow {
      background: var(--cherry);
      color: #fff;
      transform: translateX(3px);
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--cherry), var(--cherry-dark));
      border-color: transparent;
      color: #fff;
    }
    .btn.primary small { color: rgba(255, 255, 255, 0.8); }
    .btn.primary .arrow { background: rgba(255, 255, 255, 0.2); color: #fff; }
    .btn.primary:hover .arrow, .btn.primary:focus-visible .arrow { background: #fff; color: var(--cherry); }
    .btn:active { transform: translateY(0); }
  </style>
</head>
<body>
  <main>
    <h1>Covet<span>.</span></h1>
    <p class="lead">Product documentation and prototype</p>
    <nav>
      <a class="btn primary" href="covet-build-spec.html">
        <span class="text">Build Spec<small>Technical build specification</small></span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
      <a class="btn" href="covet-mvp-scope.html">
        <span class="text">MVP Scope<small>What ships in the first release</small></span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
      <a class="btn" href="prototype/index.html">
        <span class="text">Prototype<small>Clickable UI flow</small></span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
    </nav>
  </main>
</body>
</html>
